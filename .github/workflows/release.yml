# Build the macOS app and publish it as a GitHub Release when a version tag is pushed:
#   bump "version" in package.json, commit, then: git tag v0.5.0 && git push origin v0.5.0
# The installed app finds the release via "Zkontrolovat aktualizace…".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Create the release first (as a draft): otherwise the .dmg and .zip uploads
      # race to create it and the tag ends up with two half-filled releases.
      - name: Create draft release
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run electron:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
